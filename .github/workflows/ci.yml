name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build & run tests (Maven)
        run: mvn -B -DskipTests=false clean test
        working-directory: .

      - name: Static analysis (Checkstyle)
        # fails the job if Checkstyle reports violations
        run: mvn org.apache.maven.plugins:maven-checkstyle-plugin:3.1.2:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
